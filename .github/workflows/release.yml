name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      # Installed updaters require the bundle's --version to match the tag it was offered under.
      - run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"

      - run: pnpm install --no-frozen-lockfile
      - run: pnpm build
      - run: pnpm test
      - run: cp dist/index.js dist/clausona.js
      # `clausona update` refuses a release without this file, so every release ships one.
      - run: cd dist && sha256sum clausona.js > clausona.js.sha256

      # Installed updaters download the assets named clausona.js and clausona.js.sha256; keep both names.
      - name: Create or update Release
        run: |
          gh release create ${{ github.ref_name }} \
            dist/clausona.js \
            dist/clausona.js.sha256 \
            install.sh \
            install.ps1 \
            --title "${{ github.ref_name }}" \
            --generate-notes || \
          gh release upload ${{ github.ref_name }} \
            dist/clausona.js \
            dist/clausona.js.sha256 \
            install.sh \
            install.ps1 \
            --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
