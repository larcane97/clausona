name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      # Installed updaters require the bundle's --version to match the tag it was offered under.
      - run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"

      - run: pnpm install --no-frozen-lockfile
      - run: pnpm build
      - run: pnpm test
      - run: cp dist/index.js dist/clausona.js
      # `clausona update` refuses a release without this file, so every release ships one.
      - run: cd dist && sha256sum clausona.js > clausona.js.sha256

      # Installed updaters download the assets named clausona.js and clausona.js.sha256; keep both names.
      # The notes written for this version (a test requires them) open the release, and GitHub's
      # list of merged PRs follows them.
      - name: Create or update Release
        run: |
          gh release create ${{ github.ref_name }} \
            dist/clausona.js \
            dist/clausona.js.sha256 \
            install.sh \
            install.ps1 \
            --title "${{ github.ref_name }}" \
            --notes-file "docs/releases/${{ github.ref_name }}.md" \
            --generate-notes || \
          gh release upload ${{ github.ref_name }} \
            dist/clausona.js \
            dist/clausona.js.sha256 \
            install.sh \
            install.ps1 \
            --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # The clausona.js just released, published again as the npm package `clausona`. npm's trusted
  # publishing (OIDC) signs this job in, so no npm token is stored here. That works only once the
  # package exists on npm and names this workflow as its trusted publisher; docs/releases/README.md
  # has the one-time steps. Until then this job fails, and continue-on-error keeps the run green:
  # the GitHub release above is already out and does not depend on it.
  npm:
    name: Publish to npm (needs the one-time setup in docs/releases/README.md)
    needs: release
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      # Trusted publishing needs Node 22.14 or later and npm 11.5.1 or later.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@^11.5.1 && npm --version

      # The release's own asset, checked against its SHA-256 as `clausona update` checks it, so npm
      # gets the same bytes as everyone else.
      - name: Download the release's clausona.js
        run: |
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --pattern clausona.js --pattern clausona.js.sha256 --dir release
          cd release && sha256sum -c clausona.js.sha256
        env:
          GH_TOKEN: ${{ github.token }}

      - run: node scripts/npm-package.mjs --bundle release/clausona.js

      # A prerelease version such as 0.13.0-beta goes out only with an explicit tag, and `latest`
      # is the one a plain `npm install -g clausona` installs. A rerun after the package went out
      # has nothing to do.
      - name: npm publish
        working-directory: dist/npm
        run: |
          version="$(node -p "require('./package.json').version")"
          if curl -fsS -o /dev/null "https://registry.npmjs.org/clausona/$version"; then
            echo "clausona@$version is on npm already"
            exit 0
          fi
          npm publish --tag latest

      - name: Say why npm was skipped
        if: failure()
        run: >-
          echo "::warning title=Not published to npm::The GitHub release is out; only the npm copy is
          missing, for the reason the failed step above gives. Until the package exists on npm and
          names release.yml as its trusted publisher, this is expected: see Publishing to npm in
          docs/releases/README.md."
